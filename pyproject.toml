[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbridgeng"
version = "0.2.0"
description = "Proof of concept: a network device's own telemetry, rendered as a ship's bridge in the browser (Arista EOS and Juniper Junos)."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Scott Peterman" }]
keywords = ["network", "arista", "eos", "juniper", "junos", "telemetry", "visualization", "three.js", "lldp", "bgp", "ospf", "network-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "netmiko>=4.3",
    "paramiko>=4.0,<5",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/scottpeterman/netbridgeng"
Source = "https://github.com/scottpeterman/netbridgeng"
Issues = "https://github.com/scottpeterman/netbridgeng/issues"

[project.scripts]
netbridgeng = "netbridgeng.server:main"

[tool.setuptools]
packages = ["netbridgeng", "netbridgeng.collectors", "netbridgeng.collectors.arista", "netbridgeng.collectors.juniper"]
include-package-data = true

[tool.setuptools.package-data]
netbridgeng = [
    "config.example.yaml",
    "static/*.html",
    "static/vendor/*.js",
    "collectors/juniper/demo/*.xml",
    "collectors/juniper/demo/*.txt",
    "static/vendor/*.md",
    "static/vendor/fonts/*.woff2",
    "static/vendor/licenses/*.txt",
]
