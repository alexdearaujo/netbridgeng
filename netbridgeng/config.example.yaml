# netbridgeng configuration. Copy to config.yaml and edit; everything here only pre-fills the connect dialog.

device:
  host: ""                 # pre-filled in the connect dialog
  username: ""
  use_keys: true
  key_file: "~/.ssh/id_rsa"  # used when "server key" is chosen in the dialog
  timeout: 30
  session_timeout: 60
  legacy_ssh: false        # true for EOS < 4.25 / OpenSSH < 7.2 (disables rsa-sha2-256/512 pubkeys)

# Seconds between collection passes
poll_interval: 15

server:
  host: "127.0.0.1"        # the terminal proxy opens SSH sessions: keep it local unless you mean otherwise
  port: 8470
#  ssl_certfile: certs/cert.pem
#  ssl_keyfile: certs/key.pem
